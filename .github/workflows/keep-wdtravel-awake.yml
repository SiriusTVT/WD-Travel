name: Keep WDTravel responsive

on:
  schedule:
    # Every 5 minutes (UTC). GitHub can delay scheduled runs.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdtravel-health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check WDTravel health endpoint with retries
        shell: bash
        run: |
          set -euo pipefail
          url='https://wd-travel.onrender.com/health'
          echo "Checking WDTravel health endpoint (Render free tier may need a cold start)."
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3"
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 90 \
              --output /tmp/wdtravel-health.json \
              --write-out 'HTTP %{http_code} | total %{time_total}s\n' \
              "$url"; then
              echo "Health endpoint responded successfully:"
              cat /tmp/wdtravel-health.json
              echo
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Request failed. Waiting 20 seconds before retrying."
              sleep 20
            fi
          done
          echo "::error::WDTravel health check failed after 3 attempts. Check Render deployment and server logs."
          exit 1
